<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="10-Finger-Schreiben lernen auf deutschem QWERTZ">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tastenpfad">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Tastenpfad</title>
<style>
/* Layout: kompakte Lern-App im Stil von Apples Human Interface Guidelines.
   Übersicht = Lernpfad links, Statistik rechts; Übung = Text, Hände, Tastatur zentriert. */
:root {
  --bg: #f2f2f7;
  --surface: #ffffff;
  --surface-2: #f2f2f7;
  --fill: rgba(120, 120, 128, 0.12);
  --fill-strong: rgba(120, 120, 128, 0.24);
  --line: rgba(60, 60, 67, 0.16);
  --fg: #1d1d1f;
  --muted: #6e6e73;
  --accent: #007aff;
  --accent-2: #5856d6;
  --accent-fg: #ffffff;
  --accent-soft: #e3efff;
  --bad: #ff3b30;
  --bad-soft: #ffe4e2;
  --good: #34c759;
  --star: #ff9f0a;
  --f-lp: #ffd9e2; --f-lr: #ffe6c9; --f-lm: #d3f2dc; --f-li: #d7e8ff; --f-th: #e4e1fb; --f-mod: #e9e9ee;
  --key-fg: #1d1d1f;
  --key-shadow: 0 1px 0 rgba(0, 0, 0, 0.14), 0 0 0 0.5px rgba(0, 0, 0, 0.05);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 6px 20px rgba(0, 0, 0, 0.05);
  --glass: rgba(242, 242, 247, 0.72);
  --radius: 18px;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  --font-num: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --surface: #1c1c1e; --surface-2: #2c2c2e; --fill: rgba(118, 118, 128, 0.24); --fill-strong: rgba(118, 118, 128, 0.4);
    --line: rgba(84, 84, 88, 0.55); --fg: #f5f5f7; --muted: #98989d;
    --accent: #0a84ff; --accent-2: #5e5ce6; --accent-fg: #ffffff; --accent-soft: #0d2c4f;
    --bad: #ff453a; --bad-soft: #3f1a18; --good: #30d158; --star: #ffb340;
    --f-lp: #4b2531; --f-lr: #47331c; --f-lm: #1f3e2a; --f-li: #1c3452; --f-th: #2f2b4e; --f-mod: #2c2c2e; --key-fg: #f5f5f7;
    --key-shadow: 0 1px 0 rgba(0, 0, 0, 0.6), inset 0 0.5px 0 rgba(255, 255, 255, 0.06);
    --shadow: none; --glass: rgba(0, 0, 0, 0.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --surface: #1c1c1e; --surface-2: #2c2c2e; --fill: rgba(118, 118, 128, 0.24); --fill-strong: rgba(118, 118, 128, 0.4);
  --line: rgba(84, 84, 88, 0.55); --fg: #f5f5f7; --muted: #98989d;
  --accent: #0a84ff; --accent-2: #5e5ce6; --accent-fg: #ffffff; --accent-soft: #0d2c4f;
  --bad: #ff453a; --bad-soft: #3f1a18; --good: #30d158; --star: #ffb340;
  --f-lp: #4b2531; --f-lr: #47331c; --f-lm: #1f3e2a; --f-li: #1c3452; --f-th: #2f2b4e; --f-mod: #2c2c2e; --key-fg: #f5f5f7;
  --key-shadow: 0 1px 0 rgba(0, 0, 0, 0.6), inset 0 0.5px 0 rgba(255, 255, 255, 0.06);
  --shadow: none; --glass: rgba(0, 0, 0, 0.7);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--bg); }
body { margin: 0; -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 17px; line-height: 1.45; letter-spacing: -0.012em;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, .lesson:focus-visible, .toggle input:focus-visible { outline: 4px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 1px; }
.wrap { max-width: 1120px; margin: 0 auto; }

/* Kopfzeile: großer Titel auf Glas */
.top {
  position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 20px 0 14px; margin-bottom: 6px;
  background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
}
.brand { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1.1; letter-spacing: -0.025em; }
.brand small { font-family: var(--font-body); font-weight: 400; font-size: 15px; color: var(--muted); letter-spacing: -0.01em; }

/* Knöpfe: Kapselform wie in iOS/macOS */
.btn {
  border: 0; background: var(--fill); color: var(--accent); padding: 10px 18px; border-radius: 980px;
  font-size: 15px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.25;
  transition: transform 120ms ease, filter 120ms ease, background-color 120ms ease;
}
.btn:hover { filter: brightness(0.96); }
.btn:active { transform: scale(0.97); filter: brightness(0.9); }
.btn.primary { background: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; padding-inline: 8px; }
.btn.ghost:hover { background: var(--fill); filter: none; }
.btn.danger { color: var(--bad); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.02em; }
.label { font-size: 13px; text-transform: uppercase; letter-spacing: 0.02em; color: var(--muted); font-weight: 500; }
.panel { background: var(--surface); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }

/* Übersicht */
.home { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.next {
  display: flex; flex-direction: column; gap: 14px; border-radius: 22px; padding: 24px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%); color: #ffffff;
  box-shadow: 0 10px 30px color-mix(in srgb, var(--accent) 28%, transparent);
}
.next h2 { font-size: clamp(26px, 3.4vw, 34px); font-weight: 700; letter-spacing: -0.025em; }
.next .label, .next .note { color: rgba(255, 255, 255, 0.82); }
.next .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.next .cap { background: rgba(255, 255, 255, 0.2); color: #ffffff; box-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.12); }
.next .btn { background: rgba(255, 255, 255, 0.2); color: #ffffff; }
.next .btn.primary { background: #ffffff; color: var(--accent); }
.next .btn.primary .kbd { color: var(--accent); }
.keys { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.cap {
  font-family: var(--font-body); font-weight: 500; min-width: 30px; height: 30px; padding: 0 8px; display: inline-grid; place-items: center;
  border-radius: 7px; background: var(--surface); box-shadow: var(--key-shadow); font-size: 15px; letter-spacing: 0;
}
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--surface); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow); }
.tile b { display: block; font-family: var(--font-num); font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15; letter-spacing: -0.02em; }
.tile span { font-size: 13px; color: var(--muted); }

/* Lernpfad als gruppierte Liste */
.unit-list { margin: -6px -8px; }
.unit { display: flex; flex-direction: column; }
.unit + .unit { margin-top: 18px; }
.unit h3 { font-family: var(--font-body); font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.02em; color: var(--muted); padding: 0 12px 6px; }
.lesson {
  position: relative; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 12px; align-items: center;
  padding: 10px 12px; min-height: 48px; border-radius: 12px; border: 0; background: transparent; text-align: left; width: 100%;
  transition: background-color 120ms ease;
}
.lesson + .lesson::before { content: ""; position: absolute; top: 0; left: 54px; right: 12px; height: 1px; background: var(--line); transform: scaleY(0.6); }
.lesson:hover { background: var(--fill); }
.lesson:hover::before, .lesson:hover + .lesson::before, .lesson.rec::before, .lesson.rec + .lesson::before { opacity: 0; }
.lesson.rec { background: var(--accent-soft); }
.lesson .num {
  width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--fill);
  font-family: var(--font-num); font-weight: 600; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums;
}
.lesson.rec .num { background: var(--accent); color: var(--accent-fg); }
.lesson .t { font-weight: 500; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.lesson .t .keys .cap { min-width: 24px; height: 24px; font-size: 13px; border-radius: 6px; padding: 0 6px; }
.lesson .meta { display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stars { letter-spacing: 1px; font-size: 16px; color: var(--fill-strong); white-space: nowrap; }
.stars .on { color: var(--star); }
.weaklist { display: flex; flex-wrap: wrap; gap: 8px; }
.weak { display: flex; align-items: center; gap: 8px; padding: 5px 12px 5px 5px; background: var(--fill); border-radius: 980px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.weak .cap { border-radius: 50%; min-width: 26px; height: 26px; padding: 0; font-size: 13px; }
.note { font-size: 15px; color: var(--muted); max-width: 62ch; }
.note b { color: var(--fg); font-weight: 600; }
.next .note b { color: #ffffff; }

/* Einstellungen mit iOS-Schaltern */
.settings { display: flex; flex-direction: column; gap: 12px; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 16px; font-size: 15px; padding-block: 2px; }
.toggle input {
  order: 2; flex: none; -webkit-appearance: none; appearance: none; margin: 0; cursor: pointer;
  width: 51px; height: 31px; border-radius: 999px; background: var(--fill-strong); position: relative; transition: background-color 200ms ease;
}
.toggle input::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #ffffff;
  box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15), 0 1px 1px rgba(0, 0, 0, 0.16); transition: transform 200ms cubic-bezier(0.3, 0.7, 0.4, 1.2);
}
.toggle input:checked { background: var(--good); }
.toggle input:checked::after { transform: translateX(20px); }
.settings .row { display: flex; flex-wrap: wrap; gap: 10px; }

.chart svg { width: 100%; height: auto; display: block; margin-top: 8px; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ax { fill: var(--muted); font-size: 10px; font-family: var(--font-body); }
.chart .lineA { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--accent); opacity: 0.14; }
.chart .dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2.5; }

/* Tastatur im Stil des Magic Keyboard */
.kb {
  display: flex; flex-direction: column; gap: 5px; padding: 10px; background: var(--surface); border-radius: 20px; box-shadow: var(--shadow);
  user-select: none; -webkit-user-select: none;
}
.kb .r { display: flex; gap: 5px; }
.k {
  flex-basis: 0; min-width: 0; height: clamp(26px, 4.6vw, 50px); border-radius: 7px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-family: var(--font-body); font-weight: 500; font-size: clamp(10px, 1.6vw, 17px); color: var(--key-fg); position: relative; line-height: 1.05;
  transition: transform 90ms ease, box-shadow 90ms ease, background-color 90ms ease; box-shadow: var(--key-shadow);
}
.k .s { font-size: 0.72em; opacity: 0.6; }
.k.sp { font-size: clamp(9px, 1.2vw, 13px); font-weight: 400; }
.f-lp { background: var(--f-lp); } .f-lr { background: var(--f-lr); } .f-lm { background: var(--f-lm); } .f-li { background: var(--f-li); }
.f-ri { background: var(--f-li); } .f-rm { background: var(--f-lm); } .f-rr { background: var(--f-lr); } .f-rp { background: var(--f-lp); }
.f-th { background: var(--f-th); } .f-mod { background: var(--f-mod); color: var(--muted); }
.k.bump::after { content: ""; position: absolute; bottom: 18%; width: 24%; height: 2px; border-radius: 2px; background: currentColor; opacity: 0.5; }
.k.next { background: var(--accent); color: var(--accent-fg); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent), 0 4px 12px color-mix(in srgb, var(--accent) 35%, transparent); transform: translateY(-1px) scale(1.04); z-index: 1; }
.k.wrong { background: var(--bad); color: #ffffff; }
.kb.mini .k { height: clamp(22px, 2.6vw, 30px); font-size: clamp(9px, 1vw, 12px); border-radius: 5px; }
.kb.mini { padding: 8px; gap: 4px; border-radius: 14px; box-shadow: none; background: var(--surface-2); } .kb.mini .r { gap: 4px; }
.kb.heat .k:not(.f-mod) { background: color-mix(in srgb, var(--bad) var(--heat, 0%), var(--surface)); }

/* Übung */
.practice { display: flex; flex-direction: column; gap: 16px; max-width: 980px; margin: 0 auto; }
.pbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; }
.pbar h2 { font-size: 24px; font-weight: 700; flex: 1 1 260px; min-width: 0; }
.live { display: flex; gap: 8px; font-variant-numeric: tabular-nums; }
.live div { display: flex; flex-direction: column; align-items: center; min-width: 76px; padding: 8px 12px; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); }
.live b { font-family: var(--font-num); font-size: 22px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; }
.live span { font-size: 11px; color: var(--muted); white-space: nowrap; }
.progress { height: 4px; background: var(--fill); border-radius: 2px; overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 2px; transition: width 160ms ease; }
.typebox { position: relative; background: var(--surface); border-radius: 22px; padding: 24px clamp(16px, 3vw, 34px); cursor: text; box-shadow: var(--shadow); }
.textwin { --lh: calc(var(--fs) * 1.7); --fs: clamp(20px, 3vw, 30px); height: calc(var(--lh) * 3); overflow: hidden; }
.text-inner { position: relative; font-family: var(--font-mono); font-size: var(--fs); line-height: var(--lh); letter-spacing: 0; white-space: pre-wrap; word-break: normal; overflow-wrap: anywhere; transition: transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1); color: var(--fg); }
.ch { border-radius: 5px; }
.ch.ok { color: var(--muted); opacity: 0.5; }
.ch.bad { color: var(--bad); background: var(--bad-soft); }
.ch.cur { background: var(--accent-soft); box-shadow: inset 0 -3px 0 var(--accent); }
.ch.cur.miss { background: var(--bad-soft); box-shadow: inset 0 -3px 0 var(--bad); }
.ch.sp.bad { box-shadow: inset 0 -3px 0 var(--bad); }
.start-hint {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px;
  background: color-mix(in srgb, var(--surface) 70%, transparent); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  border-radius: 22px; font-size: 16px; color: var(--muted); pointer-events: none;
}
.start-hint b { color: var(--fg); font-weight: 600; }
.hands { display: flex; justify-content: center; align-items: flex-end; gap: clamp(14px, 4vw, 48px); }
.hand { display: flex; align-items: flex-end; gap: 5px; }
.fing { width: clamp(16px, 2.6vw, 26px); border-radius: 999px 999px 8px 8px; opacity: 0.85; box-shadow: var(--key-shadow); transition: transform 160ms cubic-bezier(0.3, 0.7, 0.4, 1.3), outline-color 120ms; outline: 3px solid transparent; outline-offset: 2px; }
.fing.on { outline-color: var(--accent); transform: translateY(-5px); opacity: 1; }
.fhint { text-align: center; font-weight: 600; min-height: 1.5em; }
.fhint span { color: var(--muted); font-weight: 400; }
.result { display: flex; flex-direction: column; gap: 18px; }
.result .big { display: flex; flex-wrap: wrap; gap: 24px 40px; align-items: flex-end; }
.result .big div b { display: block; font-family: var(--font-num); font-size: clamp(36px, 6vw, 54px); font-weight: 700; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.result .big div span { font-size: 13px; color: var(--muted); }
.result .stars { font-size: 40px; letter-spacing: 4px; }
.result .msg { font-size: 17px; max-width: 60ch; }
.result .row { display: flex; flex-wrap: wrap; gap: 10px; }
.kbd { font-family: var(--font-body); font-size: 11px; font-weight: 500; color: var(--muted); background: var(--fill); border-radius: 5px; padding: 1px 5px; margin-left: 6px; vertical-align: 1px; }
.btn .kbd { color: inherit; opacity: 0.7; }
.btn.primary .kbd { background: rgba(255, 255, 255, 0.22); opacity: 0.9; }

/* Kapitel: gruppierte Listen */
.chapters { display: flex; flex-direction: column; gap: 12px; }
.chapter { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.chapter summary { list-style: none; display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px 16px; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background-color 120ms ease; }
.chapter summary::-webkit-details-marker { display: none; }
.chapter summary:hover { background: var(--fill); }
.chapter summary:focus-visible { outline: 4px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: -4px; }
.chn { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--accent); color: var(--accent-fg); font-family: var(--font-num); font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; }
.cht { display: flex; flex-direction: column; min-width: 0; }
.cht b { font-family: var(--font-display); font-size: 17px; font-weight: 600; letter-spacing: -0.015em; }
.cht span { font-size: 13px; color: var(--muted); }
.chp { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.chp .bar { width: 64px; height: 6px; border-radius: 3px; background: var(--fill); overflow: hidden; }
.chp .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.chp::after { content: "›"; font-size: 22px; line-height: 1; color: var(--fill-strong); transition: transform 160ms ease; }
.chapter[open] .chp::after { transform: rotate(90deg); }
.chapter .lessons { display: flex; flex-direction: column; padding: 0 8px 8px; }
.lesson .num { width: auto; min-width: 30px; padding: 0 6px; border-radius: 980px; font-size: 12px; }
.lesson { grid-template-columns: auto minmax(0, 1fr) auto; }
.lesson .kind { font-weight: 400; font-size: 13px; color: var(--muted); }
.kindbig { font-family: var(--font-body); font-weight: 400; font-size: 0.55em; color: rgba(255, 255, 255, 0.82); letter-spacing: 0; }
.tile b small { font-size: 0.6em; color: var(--muted); font-weight: 600; }
#startExtra { font-weight: 600; color: var(--accent); }
@media (max-width: 520px) { .chp .bar { display: none; } .cht span { display: none; } }
#sink { position: fixed; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; resize: none; pointer-events: none; }
@media (max-width: 820px) {
  .home { grid-template-columns: minmax(0, 1fr); }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 520px) {
  .brand { font-size: 28px; }
  .kb { padding: 6px; gap: 3px; border-radius: 14px; } .kb .r { gap: 3px; } .k { border-radius: 5px; }
  .live div { min-width: 0; padding: 6px 10px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Tastenpfad <small>10-Finger-Schreiben, QWERTZ</small></div>
    <button class="btn ghost" id="homeBtn" hidden>← Übersicht <span class="kbd">esc</span></button>
  </header>
  <main id="home"></main>
