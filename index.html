<meta name="mobile-web-app-capable" content="yes">

<title>Tastenpfad</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: kompakte Lern-App. Übersicht = Lernpfad links, Statistik rechts; Übung = Text, Hände, Tastatur zentriert. */
:root {
  --bg: #edf0f3;
  --surface: #ffffff;
  --surface-2: #f5f7f9;
  --line: #d4dae2;
  --fg: #17202a;
  --muted: #586474;
  --accent: #0c776d;
  --accent-fg: #ffffff;
  --accent-soft: #d2eeea;
  --bad: #c23a3a;
  --bad-soft: #fbe0e0;
  --good: #2b8648;
  --star: #d5940f;
  --f-lp: #f5cdd2; --f-lr: #f7ddbc; --f-lm: #d2ecda; --f-li: #cde1f5; --f-th: #e2ddf2; --f-mod: #e6eaee;
  --key-fg: #1c2632;
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", -apple-system, system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151b; --surface: #18202a; --surface-2: #1e2731; --line: #2d3945; --fg: #e5eaef; --muted: #96a2b0;
    --accent: #3bbfb1; --accent-fg: #052421; --accent-soft: #15403b; --bad: #ff7b7b; --bad-soft: #4a2325; --good: #5ece7f; --star: #f1ba3b;
    --f-lp: #5b2f37; --f-lr: #574326; --f-lm: #2b4935; --f-li: #294158; --f-th: #3c3656; --f-mod: #252f39; --key-fg: #e5eaef;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151b; --surface: #18202a; --surface-2: #1e2731; --line: #2d3945; --fg: #e5eaef; --muted: #96a2b0;
  --accent: #3bbfb1; --accent-fg: #052421; --accent-soft: #15403b; --bad: #ff7b7b; --bad-soft: #4a2325; --good: #5ece7f; --star: #f1ba3b;
  --f-lp: #5b2f37; --f-lr: #574326; --f-lm: #2b4935; --f-li: #294158; --f-th: #3c3656; --f-mod: #252f39; --key-fg: #e5eaef;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; -webkit-text-size-adjust: 100%; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 32px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, .lesson:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 18px 14px; }
.brand { display: flex; align-items: baseline; gap: 10px; font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: -0.02em; }
.brand small { font-family: var(--font-body); font-weight: 400; font-size: 14px; color: var(--muted); letter-spacing: 0; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 16px; border-radius: 10px; font-weight: 700; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }

/* Übersicht */
.home { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.next { display: flex; flex-direction: column; gap: 14px; background: var(--accent-soft); border: 1px solid transparent; border-radius: 16px; padding: 20px; }
.next h2 { font-size: clamp(24px, 3.4vw, 34px); font-weight: 800; }
.next .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.keys { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.cap { font-family: var(--font-mono); font-weight: 600; min-width: 30px; height: 30px; padding: 0 7px; display: inline-grid; place-items: center; border-radius: 7px; border: 1px solid var(--line); border-bottom-width: 3px; background: var(--surface); font-size: 15px; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.tile b { display: block; font-family: var(--font-display); font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.2; }
.tile span { font-size: 13px; color: var(--muted); }
.unit { display: flex; flex-direction: column; gap: 4px; }
.unit + .unit { margin-top: 16px; }
.unit h3 { font-size: 15px; font-family: var(--font-body); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding-bottom: 4px; }
.lesson { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 9px 10px; border-radius: 10px; border: 1px solid transparent; background: transparent; text-align: left; width: 100%; }
.lesson:hover { background: var(--surface-2); }
.lesson.rec { border-color: var(--accent); background: var(--accent-soft); }
.lesson .num { font-family: var(--font-mono); color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.lesson .t { font-weight: 700; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.lesson .t .keys .cap { min-width: 24px; height: 24px; font-size: 13px; border-bottom-width: 2px; }
.lesson .meta { display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stars { letter-spacing: 1px; font-size: 16px; color: var(--line); white-space: nowrap; }
.stars .on { color: var(--star); }
.weaklist { display: flex; flex-wrap: wrap; gap: 8px; }
.weak { display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 6px; background: var(--surface-2); border-radius: 10px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.note { font-size: 14px; color: var(--muted); max-width: 62ch; }
.note b { color: var(--fg); }
.settings { display: flex; flex-direction: column; gap: 10px; }
.toggle { display: flex; align-items: center; gap: 10px; font-size: 15px; }
.toggle input { width: 18px; height: 18px; accent-color: var(--accent); }
.chart svg { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ax { fill: var(--muted); font-size: 10px; font-family: var(--font-mono); }
.chart .lineA { fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--accent); opacity: 0.12; }
.chart .dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }

/* Tastatur */
.kb { display: flex; flex-direction: column; gap: 5px; padding: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; user-select: none; -webkit-user-select: none; }
.kb .r { display: flex; gap: 5px; }
.k { flex-basis: 0; min-width: 0; height: clamp(26px, 4.6vw, 50px); border-radius: 7px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: clamp(10px, 1.6vw, 17px); color: var(--key-fg); position: relative; line-height: 1.05; transition: transform 80ms, box-shadow 80ms; box-shadow: inset 0 -2px 0 rgba(0,0,0,0.08); }
.k .s { font-size: 0.72em; opacity: 0.7; }
.k.sp { font-size: clamp(9px, 1.2vw, 13px); opacity: 0.9; }
.f-lp { background: var(--f-lp); } .f-lr { background: var(--f-lr); } .f-lm { background: var(--f-lm); } .f-li { background: var(--f-li); }
.f-ri { background: var(--f-li); } .f-rm { background: var(--f-lm); } .f-rr { background: var(--f-lr); } .f-rp { background: var(--f-lp); }
.f-th { background: var(--f-th); } .f-mod { background: var(--f-mod); color: var(--muted); }
.k.bump::after { content: ""; position: absolute; bottom: 18%; width: 26%; height: 2px; border-radius: 2px; background: currentColor; opacity: 0.55; }
.k.next { background: var(--accent); color: var(--accent-fg); box-shadow: 0 0 0 3px var(--accent-soft); transform: translateY(-1px); }
.k.wrong { background: var(--bad); color: var(--surface); }
.kb.mini .k { height: clamp(22px, 2.6vw, 30px); font-size: clamp(9px, 1vw, 12px); }
.kb.mini { padding: 8px; gap: 4px; } .kb.mini .r { gap: 4px; }
.kb.heat .k:not(.f-mod) { background: color-mix(in srgb, var(--bad) var(--heat, 0%), var(--surface-2)); }

/* Übung */
.practice { display: flex; flex-direction: column; gap: 16px; max-width: 980px; margin: 0 auto; }
.pbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; }
.pbar h2 { font-size: 22px; font-weight: 800; flex: 1 1 260px; min-width: 0; }
.live { display: flex; gap: 18px; font-variant-numeric: tabular-nums; }
.live div { display: flex; flex-direction: column; align-items: flex-end; }
.live b { font-family: var(--font-display); font-size: 22px; font-weight: 800; line-height: 1.1; }
.live span { font-size: 12px; color: var(--muted); }
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 120ms; }
.typebox { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px clamp(16px, 3vw, 32px); cursor: text; }
.textwin { --lh: calc(var(--fs) * 1.7); --fs: clamp(20px, 3vw, 30px); height: calc(var(--lh) * 3); overflow: hidden; }
.text-inner { position: relative; font-family: var(--font-mono); font-size: var(--fs); line-height: var(--lh); white-space: pre-wrap; word-break: normal; overflow-wrap: anywhere; transition: transform 160ms ease; color: var(--fg); }
.ch { border-radius: 4px; }
.ch.ok { color: var(--muted); opacity: 0.55; }
.ch.bad { color: var(--bad); background: var(--bad-soft); }
.ch.cur { background: var(--accent-soft); box-shadow: inset 0 -3px 0 var(--accent); }
.ch.cur.miss { background: var(--bad-soft); box-shadow: inset 0 -3px 0 var(--bad); }
.ch.sp.bad { box-shadow: inset 0 -3px 0 var(--bad); }
.start-hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; background: color-mix(in srgb, var(--surface) 82%, transparent); border-radius: 16px; font-size: 16px; color: var(--muted); pointer-events: none; }
.start-hint b { color: var(--fg); }
.hands { display: flex; justify-content: center; align-items: flex-end; gap: clamp(14px, 4vw, 48px); }
.hand { display: flex; align-items: flex-end; gap: 5px; }
.fing { width: clamp(16px, 2.6vw, 26px); border-radius: 12px 12px 6px 6px; opacity: 0.85; transition: transform 120ms, outline-color 120ms; outline: 3px solid transparent; outline-offset: 1px; }
.fing.on { outline-color: var(--accent); transform: translateY(-4px); opacity: 1; }
.fhint { text-align: center; font-weight: 700; min-height: 1.5em; }
.fhint span { color: var(--muted); font-weight: 400; }
.result { display: flex; flex-direction: column; gap: 16px; }
.result .big { display: flex; flex-wrap: wrap; gap: 24px 40px; align-items: flex-end; }
.result .big div b { display: block; font-family: var(--font-display); font-size: clamp(34px, 6vw, 52px); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.result .big div span { font-size: 13px; color: var(--muted); }
.result .stars { font-size: 40px; letter-spacing: 4px; }
.result .msg { font-size: 17px; max-width: 60ch; }
.result .row { display: flex; flex-wrap: wrap; gap: 10px; }
.kbd { font-family: var(--font-mono); font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 6px; }
.btn.primary .kbd { color: inherit; border-color: currentColor; opacity: 0.75; }
#sink { position: fixed; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; resize: none; pointer-events: none; }
@media (max-width: 820px) {
  .home { grid-template-columns: minmax(0, 1fr); }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 520px) {
  .kb { padding: 6px; gap: 3px; } .kb .r { gap: 3px; } .k { border-radius: 5px; }
  .live { gap: 12px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Tastenpfad <small>10-Finger-Schreiben, QWERTZ</small></div>
    <button class="btn ghost" id="homeBtn" hidden>← Übersicht <span class="kbd">esc</span></button>
  </header>
  <main id="home"></main>
  <main id="practice" class="practice" hidden>
    <div class="pbar">
      <h2 id="pTitle">Lektion</h2>
      <div class="live">
        <div><b id="lApm">0</b><span>Anschläge/Min</span></div>
        <div><b id="lAcc">100</b><span>% Genauigkeit</span></div>
        <div><b id="lTime">0:00</b><span>Zeit</span></div>
      </div>
    </div>
    <div class="progress"><i id="pBar"></i></div>
    <div class="typebox" id="typebox">
      <div class="textwin"><div class="text-inner" id="text"></div></div>
      <div class="start-hint" id="startHint"><div>Finger auf die Grundreihe legen: <b>A S D F</b> links, <b>J K L Ö</b> rechts.<br>F und J haben kleine Erhebungen. Tippe das erste Zeichen, um zu starten.</div></div>
    </div>
    <div class="result panel" id="result" hidden></div>
    <div class="fhint" id="fhint"></div>
    <div class="hands" id="hands"></div>
    <div id="kbWrap"></div>
  </main>
</div>
<textarea id="sink" inputmode="none" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-hidden="true" tabindex="-1"></textarea>

<script>
(() => {
const $ = (s) => document.querySelector(s);
const de = (n, d = 0) => Number(n).toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d });
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- Finger und Tastatur ---------- */
const FINGERS = { lp: 'Linker kleiner Finger', lr: 'Linker Ringfinger', lm: 'Linker Mittelfinger', li: 'Linker Zeigefinger', th: 'Daumen', ri: 'Rechter Zeigefinger', rm: 'Rechter Mittelfinger', rr: 'Rechter Ringfinger', rp: 'Rechter kleiner Finger' };
const FINGER_OF = {};
const assign = (f, chars) => { for (const c of chars) FINGER_OF[c] = f; };
assign('lp', '^1qa<y'); assign('lr', '2wsx'); assign('lm', '3edc'); assign('li', '45rtfgvb');
assign('ri', '67zuhjnm'); assign('rm', '8ik,'); assign('rr', '9ol.'); assign('rp', '0ß´pü+öä#-');
const HOME = { lp: 'a', lr: 's', lm: 'd', li: 'f', ri: 'j', rm: 'k', rr: 'l', rp: 'ö', th: ' ' };
const LEFT = new Set(['lp', 'lr', 'lm', 'li']);

const K = (base, shift) => ({ id: base, base, shift, w: 1 });
const S = (id, label, w, finger) => ({ id, label, w, finger, special: true });
const letterKeys = (s) => s.split('').map((c) => K(c, c.toUpperCase()));
const ROWS = [
  [K('^', '°'), K('1', '!'), K('2', '"'), K('3', '§'), K('4', '$'), K('5', '%'), K('6', '&'), K('7', '/'), K('8', '('), K('9', ')'), K('0', '='), K('ß', '?'), K('´', '`'), S('Backspace', '⌫', 2, 'rp')],
  [S('Tab', '⇥', 1.5, 'lp'), ...letterKeys('qwertzuiopü'), K('+', '*'), S('Enter', '↵', 1.5, 'rp')],
  [S('Caps', '⇪', 1.75, 'lp'), ...letterKeys('asdfghjklöä'), K('#', "'"), S('Enter2', '', 1.25, 'rp')],
  [S('ShiftL', '⇧', 1.25, 'lp'), K('<', '>'), ...letterKeys('yxcvbnm'), K(',', ';'), K('.', ':'), K('-', '_'), S('ShiftR', '⇧', 2.75, 'rp')],
  [S('c1', 'ctrl', 1.5, 'mod'), S('c2', '⌥', 1.25, 'mod'), S('c3', '⌘', 1.5, 'mod'), S('Space', 'Leertaste', 6.5, 'th'), S('c4', '⌘', 1.5, 'mod'), S('c5', '⌥', 1.25, 'mod'), S('c6', 'ctrl', 1.5, 'mod')],
];
const CHAR = {};
ROWS.flat().forEach((k) => {
  if (k.special) return;
  const f = FINGER_OF[k.base];
  CHAR[k.base] = { id: k.id, shift: false, finger: f };
  if (k.shift) CHAR[k.shift] = { id: k.id, shift: true, finger: f };
});
CHAR[' '] = { id: 'Space', shift: false, finger: 'th' };
const fingerClass = (f) => 'f-' + f;

function renderKeyboard(container, opts = {}) {
  const kb = document.createElement('div');
  kb.className = 'kb' + (opts.mini ? ' mini' : '') + (opts.heat ? ' heat' : '');
  const els = {};
  for (const row of ROWS) {
    const r = document.createElement('div'); r.className = 'r';
    for (const k of row) {
      const el = document.createElement('div');
      const f = k.special ? k.finger : FINGER_OF[k.base];
      el.className = 'k ' + fingerClass(f) + (k.special ? ' sp' : '') + (k.base === 'f' || k.base === 'j' ? ' bump' : '');
      el.style.flexGrow = k.w;
      if (k.special) el.textContent = opts.mini && k.id === 'Space' ? '' : k.label;
      else if (/[a-zäöü]/.test(k.base)) el.textContent = k.shift;
      else el.innerHTML = `<span class="s">${esc(k.shift)}</span><span>${esc(k.base)}</span>`;
      if (opts.heat && !k.special) {
        const h = opts.heat(k.base);
        if (h != null) { el.style.setProperty('--heat', Math.round(h * 100) + '%'); el.title = `${k.shift}: ${de(h * 100)} % Fehler`; }
      }
      (els[k.id] ||= []).push(el);
      r.append(el);
    }
    kb.append(r);
  }
  container.innerHTML = ''; container.append(kb);
  return els;
}

function scopeFor(i) {
  const set = new Set([' ']); let shift = false;
  for (let j = 0; j <= i; j++) { for (const c of LESSONS[j].add) set.add(c); if (LESSONS[j].shift) shift = true; }
  return { set, shift };
}
function fitWord(w, scope) {
  const v = scope.shift ? w : w.toLowerCase();
  for (const c of v) {
    const lc = c.toLowerCase();
    if (c !== lc) { if (!scope.shift || !scope.set.has(lc)) return null; }
    else if (!scope.set.has(c)) return null;
  }
  return v;
}
const isLetter = (c) => /[a-zäöüß]/.test(c);

function genText({ scope, focus, drill, len, shiftDrill }) {
  const parts = [];
  const letters = [...scope.set].filter(isLetter);
  const puncts = [...scope.set].filter((c) => ',.-?!:'.includes(c));
  const digits = [...scope.set].filter((c) => /\d/.test(c));
  const focusP = focus.filter((c) => ',.-?!:'.includes(c));
  const focusD = focus.filter((c) => /\d/.test(c));
  const focusL = focus.filter(isLetter);

  for (const k of drill) {
    const h = HOME[CHAR[k]?.finger] || 'f';
    if (h === k || h === ' ') parts.push(k + k + k, k + k, k + k + k);
    else parts.push(k + k + k, h + k + h, k + h + k, h + h + k);
  }
  if (drill.length > 1) for (let i = 0; i < 3; i++) parts.push(shuffle(drill.concat(drill)).slice(0, 3).join(''));
  if (shiftDrill) for (const c of shuffle('asdfjklöghei'.split('')).slice(0, 6)) parts.push(c.toUpperCase() + c);

  const pool = [...new Set(WORDS.map((w) => fitWord(w, scope)).filter(Boolean))];
  const fset = new Set(focusL);
  let fpool = shiftDrill ? pool.filter((w) => /^[A-ZÄÖÜ]/.test(w)) : pool.filter((w) => [...w.toLowerCase()].some((c) => fset.has(c)));
  const useReal = pool.length >= 8;
  const pseudo = () => {
    const n = 2 + Math.floor(Math.random() * 4); let s = '';
    for (let i = 0; i < n; i++) s += (focusL.length && Math.random() < 0.5) ? pick(focusL) : pick(letters);
    return s;
  };
  const num = () => { const src = focusD.length ? focusD : digits; let s = ''; const n = 1 + Math.floor(Math.random() * 3); for (let i = 0; i < n; i++) s += pick(src); return s; };
  const word = () => useReal ? ((fpool.length && Math.random() < 0.7) ? pick(fpool) : pick(pool)) : pseudo();

  let total = parts.join(' ').length;
  let prev = '';
  while (total < len) {
    let w = word();
    if (w === prev && pool.length > 3) continue;
    prev = w;
    if (digits.length && Math.random() < (focusD.length ? 0.45 : 0.1)) w = num() + ' ' + w;
    if (puncts.length && Math.random() < (focusP.length ? 0.4 : 0.15)) {
      const p = pick(focusP.length ? focusP : puncts);
      w = p === '-' ? w + '-' + word() : w + p;
    }
    parts.push(w); total += w.length + 1;
  }
  // nach Satzende groß weiterschreiben, wenn Umschalt schon gelernt ist
  if (scope.shift) for (let i = 1; i < parts.length; i++) if (/[A-Za-zÄÖÜäöüß][.?!]$/.test(parts[i - 1])) parts[i] = parts[i].charAt(0).toUpperCase() + parts[i].slice(1);
  return parts.join(' ').replace(/\s+/g, ' ').trim();
}
function sentencesText(len) {
  const out = []; let t = 0;
  for (const s of shuffle(SENTENCES)) { out.push(s); t += s.length + 1; if (t >= len) break; }
  return out.join(' ');
}
function lessonText(i) {
  const L = LESSONS[i]; const scope = scopeFor(i);
  const len = Math.min(240, 140 + i * 5);
  if (L.sentences) return sentencesText(260);
  const add = [...L.add];
  const allLetters = [...scope.set].filter(isLetter);
  return genText({ scope, focus: add.length ? add : (L.shift ? [] : allLetters), drill: L.review ? [] : add, len, shiftDrill: !!L.shift });
}

const STORE = 'tastenpfad.v1';
const fresh = () => ({ v: 1, lessons: {}, keys: {}, history: [], settings: { block: true, keyboard: true } });
let state = (() => { try { const s = JSON.parse(localStorage.getItem(STORE)); if (s && s.v === 1) return Object.assign(fresh(), s); } catch (e) {} return fresh(); })();
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} };
const keyOf = (c) => (c === ' ' ? ' ' : c.toLowerCase());
const ks = (c) => (state.keys[c] ||= { n: 0, err: 0, t: 0, tn: 0 });

function recommended() {
  const i = LESSONS.findIndex((l) => !(state.lessons[l.id]?.stars >= 1));
  return i === -1 ? LESSONS.length - 1 : i;
}
function reachedIdx() {
  let m = 0; LESSONS.forEach((l, i) => { if (state.lessons[l.id]) m = i; });
  return Math.max(m, recommended() - 1, 0);
}
function keyScores() {
  let tsum = 0, tn = 0;
  for (const s of Object.values(state.keys)) { tsum += s.t; tn += s.tn; }
  const avg = tn ? tsum / tn : 0;
  const arr = [];
  for (const [c, s] of Object.entries(state.keys)) {
    if (c === ' ' || s.n < 6) continue;
    const er = Math.min(1, s.err / s.n);
    const sl = avg && s.tn ? (s.t / s.tn) / avg : 1;
    arr.push({ c, er, sl, score: er * 4 + Math.max(0, sl - 1) });
  }
  return arr.sort((a, b) => b.score - a.score);
}

function chartSvg(h) {
  if (h.length < 2) return '<p class="note">Sobald du zwei Übungen gemacht hast, erscheint hier dein Tempoverlauf.</p>';
  const W = 320, H = 120, L = 30, R = 8, T = 10, B = 18;
  const max = Math.max(20, Math.ceil(Math.max(...h.map((x) => x.apm)) / 20) * 20);
  const x = (i) => L + (i * (W - L - R)) / (h.length - 1);
  const y = (v) => T + (H - T - B) * (1 - v / max);
  const ticks = [0, max / 2, max];
  const pts = h.map((p, i) => `${x(i).toFixed(1)},${y(p.apm).toFixed(1)}`).join(' ');
  const lastI = h.length - 1;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Anschläge pro Minute, letzte ${h.length} Übungen">
    ${ticks.map((t) => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${L - 5}" y="${y(t) + 3}" text-anchor="end">${t}</text>`).join('')}
    <polygon class="area" points="${x(0)},${y(0)} ${pts} ${x(lastI)},${y(0)}"/>
    <polyline class="lineA" points="${pts}"/>
    <circle class="dot" cx="${x(lastI)}" cy="${y(h[lastI].apm)}" r="4"/>
    <text class="ax" x="${L}" y="${H - 4}">älter</text><text class="ax" x="${W - R}" y="${H - 4}" text-anchor="end">zuletzt: ${h[lastI].apm} A/Min</text>
  </svg>`;
}

let P = null, spans = [], kbEls = {}, ticker = null;

const fcol = { lp: 'f-lp', lr: 'f-lr', lm: 'f-lm', li: 'f-li', th: 'f-th', ri: 'f-li', rm: 'f-lm', rr: 'f-lr', rp: 'f-lp' };

function startLesson(i) {
  const L = LESSONS[i];
  begin({ mode: 'lesson', idx: i, title: `Lektion ${i + 1} · ${L.title}`, target: L.target, text: lessonText(i) });
}
function startWeak() {
  const weak = keyScores().filter((k) => isLetter(k.c)).slice(0, 5).map((k) => k.c);
  if (weak.length < 2) { startLesson(recommended()); return; }
  const scope = scopeFor(Math.max(reachedIdx(), 5));
  weak.forEach((c) => scope.set.add(c));
  begin({ mode: 'weak', title: 'Schwache Tasten: ' + weak.map((c) => c.toUpperCase()).join(' '), target: 0, text: genText({ scope, focus: weak, drill: weak, len: 200 }) });
}
function begin(cfg) {
  view = 'practice';
  P = Object.assign(cfg, { pos: 0, correct: 0, wrong: 0, errPos: new Set(), start: 0, last: 0, done: false });
  $('#home').hidden = true; $('#practice').hidden = false; $('#homeBtn').hidden = false;
  $('#pTitle').textContent = cfg.title;
  $('#result').hidden = true; $('#typebox').hidden = false; $('#startHint').hidden = false;
  const showKb = state.settings.keyboard;
  $('#kbWrap').hidden = !showKb; $('#hands').hidden = !showKb;
  kbEls = renderKeyboard($('#kbWrap'));
  $('#hands').innerHTML = '<div class="hand">' + handsOrder.slice(0, 5).map(([f, h]) => `<div class="fing ${fcol[f]}" data-f="${f}" style="height:${h}px"></div>`).join('') + '</div><div class="hand">' + handsOrder.slice(5).map(([f, h]) => `<div class="fing ${fcol[f]}" data-f="${f}" style="height:${h}px"></div>`).join('') + '</div>';
  renderText(cfg.text);
  updateLive(); highlightNext(); focusSink();
  window.scrollTo({ top: 0 });
}
function renderText(text) {
  const inner = $('#text'); inner.innerHTML = ''; inner.style.transform = '';
  spans = [];
  let word = null;
  for (const ch of text) {
    const sp = document.createElement('span'); sp.className = 'ch';
    if (ch === ' ') { sp.classList.add('sp'); sp.textContent = ' '; word = null; inner.append(sp); }
    else { if (!word) { word = document.createElement('span'); inner.append(word); } sp.textContent = ch; word.append(sp); }
    spans.push(sp);
  }
  spans[0]?.classList.add('cur');
}
function scrollText() {
  const sp = spans[Math.min(P.pos, spans.length - 1)]; if (!sp) return;
  const inner = $('#text');
  const lh = parseFloat(getComputedStyle(inner).lineHeight) || 40;
  const y = Math.max(0, sp.offsetTop - lh);
  inner.style.transform = `translateY(${-y}px)`;
}
let lastKeys = [];
function highlightNext() {
  lastKeys.forEach((el) => el.classList.remove('next')); lastKeys = [];
  document.querySelectorAll('.fing.on').forEach((el) => el.classList.remove('on'));
  if (!P || P.done) { $('#fhint').textContent = ''; return; }
  const ch = P.text[P.pos]; const info = CHAR[ch];
  if (!info) { $('#fhint').textContent = ''; return; }
  const add = (id) => (kbEls[id] || []).forEach((el) => { el.classList.add('next'); lastKeys.push(el); });
  add(info.id);
  let shiftTxt = '';
  if (info.shift) {
    const left = LEFT.has(info.finger);
    add(left ? 'ShiftR' : 'ShiftL');
    shiftTxt = ` + Umschalt mit dem ${left ? 'rechten' : 'linken'} kleinen Finger`;
    document.querySelector(`.fing[data-f="${left ? 'rp' : 'lp'}"]`)?.classList.add('on');
  }
  document.querySelectorAll(`.fing[data-f="${info.finger}"]`).forEach((el) => el.classList.add('on'));
  $('#fhint').innerHTML = esc(FINGERS[info.finger]) + (ch === ' ' ? ' <span>· Leertaste</span>' : '') + (shiftTxt ? ` <span>${esc(shiftTxt)}</span>` : '');
}
function flashWrong(ch) {
  const info = CHAR[ch]; if (!info) return;
  (kbEls[info.id] || []).forEach((el) => { el.classList.add('wrong'); setTimeout(() => el.classList.remove('wrong'), 220); });
}
function fmtTime(ms) { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
function updateLive() {
  const ms = P.start ? performance.now() - P.start : 0;
  const apm = ms > 1500 ? Math.round(P.correct / (ms / 60000)) : 0;
  const acc = P.correct + P.wrong ? (100 * P.correct) / (P.correct + P.wrong) : 100;
  $('#lApm').textContent = apm; $('#lAcc').textContent = de(acc, acc === 100 ? 0 : 1); $('#lTime').textContent = fmtTime(ms);
  $('#pBar').style.width = (100 * P.pos) / P.text.length + '%';
}
function typeChar(ch) {
  if (!P || P.done) return;
  const exp = P.text[P.pos]; const now = performance.now();
  if (!P.start) { P.start = now; P.last = now; $('#startHint').hidden = true; ticker = setInterval(updateLive, 500); }
  const k = keyOf(exp);
  const advance = (ok) => {
    const sp = spans[P.pos];
    sp.classList.remove('cur', 'miss'); sp.classList.add(ok && !P.errPos.has(P.pos) ? 'ok' : 'bad');
    P.pos++; P.last = now;
    if (P.pos >= P.text.length) { finish(); return; }
    spans[P.pos].classList.add('cur'); scrollText(); highlightNext();
  };
  if (ch === exp) {
    P.correct++;
    const st = ks(k); st.n++;
    const dt = now - P.last;
    if (P.pos > 0 && !P.errPos.has(P.pos) && dt < 3000) { st.t += dt; st.tn++; }
    advance(true);
  } else {
    P.wrong++;
    if (!P.errPos.has(P.pos)) { P.errPos.add(P.pos); ks(k).err++; }
    flashWrong(ch);
    spans[P.pos].classList.add('miss');
    if (!state.settings.block) { ks(k).n++; advance(false); }
  }
  if (!P.done) updateLive();
}
function finish() {
  P.done = true; clearInterval(ticker);
  const ms = performance.now() - P.start;
  const apm = Math.round(P.correct / (ms / 60000));
  const acc = Math.round((1000 * P.correct) / (P.correct + P.wrong)) / 10;
  let stars = 0;
  const L = P.mode === 'lesson' ? LESSONS[P.idx] : null;
  if (L) {
    stars = acc < 90 ? 0 : acc >= 97 && apm >= L.target * 1.25 ? 3 : acc >= 94 && apm >= L.target ? 2 : 1;
    const r = (state.lessons[L.id] ||= { stars: 0, bestApm: 0, bestAcc: 0, runs: 0 });
    r.stars = Math.max(r.stars, stars); r.bestApm = Math.max(r.bestApm, apm); r.bestAcc = Math.max(r.bestAcc, acc); r.runs++;
  }
  state.history.push({ d: Date.now(), l: L ? L.id : 'weak', apm, acc, ms: Math.round(ms) });
  if (state.history.length > 300) state.history = state.history.slice(-300);
  save();

  const missed = {};
  P.errPos.forEach((i) => { const c = P.text[i]; missed[c] = (missed[c] || 0) + 1; });
  const missedList = Object.entries(missed).sort((a, b) => b[1] - a[1]).slice(0, 8);
  let msg;
  if (!L) msg = 'Gut gemacht. Deine Fehlerstatistik ist aktualisiert, die nächste Runde passt sich daran an.';
  else if (stars === 0) msg = 'Unter 90 % Genauigkeit. Tippe langsamer und gleichmäßig, Tempo kommt von selbst, wenn die Finger sicher sind.';
  else if (stars === 1) msg = acc < 94 ? `Bestanden. Für den zweiten Stern brauchst du mindestens 94 % Genauigkeit und ${L.target} Anschläge pro Minute.` : `Bestanden. Für den zweiten Stern fehlt noch etwas Tempo: Ziel sind ${L.target} Anschläge pro Minute.`;
  else if (stars === 2) msg = `Stark. Drei Sterne gibt es ab 97 % Genauigkeit und ${Math.round(L.target * 1.25)} Anschlägen pro Minute.`;
  else msg = 'Drei Sterne. Weiter zur nächsten Lektion!';
  const hasNext = L && stars >= 1 && P.idx < LESSONS.length - 1;

  $('#typebox').hidden = true; $('#fhint').textContent = '';
  highlightNext();
  const res = $('#result'); res.hidden = false;
  res.innerHTML = `
    ${L ? starsHtml(stars) : '<span class="label">Übung beendet</span>'}
    <div class="big">
      <div><b>${apm}</b><span>Anschläge pro Minute (≈ ${Math.round(apm / 5)} Wörter/Min)</span></div>
      <div><b>${de(acc, 1)} %</b><span>Genauigkeit</span></div>
      <div><b>${fmtTime(ms)}</b><span>Zeit</span></div>
    </div>
    <p class="msg" style="margin:0">${esc(msg)}</p>
    ${missedList.length ? `<div class="row" style="align-items:center"><span class="label">Vertippt bei</span>${missedList.map(([c, n]) => `<span class="weak"><span class="cap">${esc(c === ' ' ? '␣' : c)}</span>${n}×</span>`).join('')}</div>` : ''}
    <div class="row">
      ${hasNext ? `<button class="btn primary" id="rNext">Nächste Lektion <span class="kbd">↵</span></button><button class="btn" id="rAgain">Nochmal</button>`
        : `<button class="btn primary" id="rAgain">Nochmal <span class="kbd">↵</span></button>`}
      <button class="btn ghost" id="rHome">Zur Übersicht</button>
    </div>`;
  P.primary = hasNext ? () => startLesson(P.idx + 1) : again;
  $('#rAgain').onclick = again;
  if (hasNext) $('#rNext').onclick = P.primary;
  $('#rHome').onclick = renderHome;
  focusSink();
}
function again() { if (P.mode === 'lesson') startLesson(P.idx); else startWeak(); }
function focusSink() { try { $('#sink').focus({ preventScroll: true }); } catch (e) {} }

/* ---------- Eingabe ---------- */
window.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey) return;
  if (view === 'home') {
    if (e.key === 'Enter' && !(e.target instanceof HTMLButtonElement) && !(e.target instanceof HTMLInputElement)) { e.preventDefault(); startLesson(recommended()); }
    return;
  }
  if (e.key === 'Escape') { e.preventDefault(); clearInterval(ticker); renderHome(); return; }
  if (P.done) { if (e.key === 'Enter') { e.preventDefault(); P.primary(); } return; }
  if (e.key === 'Dead') { e.preventDefault(); $('#fhint').innerHTML = 'Tote Taste <span>(´ ^ `) kommt in den Übungen nicht vor</span>'; return; }
  if (e.key === 'Unidentified' || e.key === 'Process') return;
  if (e.key.length !== 1) { if (['Backspace', 'Tab', 'Enter'].includes(e.key)) e.preventDefault(); return; }
  e.preventDefault();
  typeChar(e.key);
});
$('#sink').addEventListener('input', () => {
  const v = $('#sink').value; $('#sink').value = '';
  if (view === 'practice' && P && !P.done) for (const ch of v) if (ch !== '\n') typeChar(ch);
});
$('#typebox').addEventListener('pointerdown', focusSink);
$('#homeBtn').onclick = () => { clearInterval(ticker); renderHome(); };
window.addEventListener('resize', () => { if (view === 'practice' && P && !P.done) scrollText(); });

renderHome();
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
